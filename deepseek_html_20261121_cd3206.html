<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой ИИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0b1a; /* тёмно-синий фон как на картинке */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            padding: 20px;
        }

        .sphere-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
            border-radius: 50%;
            overflow: hidden;
            /* Запасной градиент в цветах вашей картинки */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #a5b4fc 20%, #ec4899 55%, #6366f1 80%, #1e1b4b 100%);
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.35);
        }

        .sphere-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: filter 0.3s ease, transform 0.3s ease;
            display: block;
        }

        .sphere-container.listening img,
        .sphere-container.listening {
            filter: brightness(1.4) drop-shadow(0 0 35px #a855f7);
            transform: scale(1.04);
            animation: pulse 1.2s ease-in-out infinite;
        }

        .sphere-container.speaking img,
        .sphere-container.speaking {
            filter: brightness(1.6) drop-shadow(0 0 45px #ec4899);
            animation: pulse 0.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .chat-log {
            width: 100%;
            max-width: 600px;
            height: 200px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-log .user { color: #60a5fa; margin-bottom: 8px; }
        .chat-log .assistant { color: #f0abfc; margin-bottom: 8px; }
        .chat-log .system { color: #9ca3af; font-style: italic; margin-bottom: 8px; }

        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-row input:disabled { opacity: 0.4; }

        .input-row button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .input-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .input-row button.recording {
            animation: pulse 1s infinite;
            background: #ef4444;
        }

        #loadBtn {
            width: auto;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 16px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            cursor: pointer;
        }

        .progress-wrap {
            width: 100%;
            max-width: 600px;
            margin-bottom: 16px;
            display: none;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="sphere-container" id="sphere">
        <!-- Положите картинку рядом с HTML и назовите sphere.jpg -->
        <img id="sphereImg" src="sphere.jpg" alt="AI Sphere">
    </div>

    <button id="loadBtn">Загрузить ИИ (1.4 ГБ)</button>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <div class="chat-log" id="chatLog">
        <div class="system">Нажмите «Загрузить ИИ», чтобы скачать модель в браузер.</div>
    </div>

    <div class="input-row">
        <input type="text" id="userInput" placeholder="Напиши сообщение..." disabled>
        <button id="micBtn" disabled title="Голосовой ввод">🎤</button>
        <button id="sendBtn" disabled title="Отправить">➤</button>
    </div>

    <script type="module">
        import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm@0.2.79';

        const sphere = document.getElementById('sphere');
        const loadBtn = document.getElementById('loadBtn');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const chatLog = document.getElementById('chatLog');
        const userInput = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');

        let engine = null;
        let isRecording = false;

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = role;
            div.textContent = `${role === 'user' ? 'Вы' : 'ИИ'}: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function addSystem(text) {
            const div = document.createElement('div');
            div.className = 'system';
            div.textContent = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        loadBtn.addEventListener('click', async () => {
            if (engine) return;

            if (!navigator.gpu) {
                addSystem('Ошибка: ваш браузер не поддерживает WebGPU. Используйте Chrome или Edge последних версий.');
                return;
            }

            loadBtn.disabled = true;
            loadBtn.textContent = 'Загрузка...';
            progressWrap.style.display = 'block';

            try {
                engine = await CreateMLCEngine('Llama-3.2-3B-Instruct-q4f32_1-MLC', {
                    initProgressCallback: (report) => {
                        const percent = Math.round(report.progress * 100);
                        progressFill.style.width = percent + '%';
                        progressText.textContent = `${percent}% — ${report.text || 'загрузка...'}`;
                    },
                    useIndexedDBCache: true,
                });

                addSystem('Модель готова. Можно общаться текстом или голосом.');
                userInput.disabled = false;
                micBtn.disabled = false;
                sendBtn.disabled = false;
                loadBtn.style.display = 'none';
                progressWrap.style.display = 'none';
                userInput.focus();
            } catch (err) {
                console.error(err);
                addSystem('Ошибка загрузки модели: ' + err.message);
                loadBtn.disabled = false;
                loadBtn.textContent = 'Повторить загрузку';
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !engine) return;

            addMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            micBtn.disabled = true;

            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'assistant';
            assistantDiv.textContent = 'ИИ: ';
            chatLog.appendChild(assistantDiv);
            chatLog.scrollTop = chatLog.scrollHeight;

            try {
                const stream = await engine.chat.completions.create({
                    messages: [
                        { role: 'system', content: 'Ты дружелюбный голосовой ассистент. Отвечай кратко и по делу на русском языке.' },
                        { role: 'user', content: text }
                    ],
                    stream: true,
                    temperature: 0.7,
                    max_tokens: 512,
                });

                let fullResponse = '';
                for await (const chunk of stream) {
                    const delta = chunk.choices[0]?.delta?.content || '';
                    fullResponse += delta;
                    assistantDiv.textContent = 'ИИ: ' + fullResponse;
                    chatLog.scrollTop = chatLog.scrollHeight;
                }

                speakText(fullResponse);
            } catch (err) {
                console.error(err);
                assistantDiv.textContent = 'ИИ: [Ошибка генерации]';
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                micBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                sphere.classList.add('listening');
                userInput.placeholder = 'Говори...';
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                userInput.value = speechResult;
                sendMessage();
            };

            recognition.onerror = (event) => {
                console.error('Ошибка микрофона:', event.error);
                stopRecording();
            };

            recognition.onend = () => stopRecording();
        } else {
            micBtn.style.display = 'none';
            addSystem('Голосовой ввод не поддерживается в этом браузере.');
        }

        function toggleVoice() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.warn('Не удалось запустить запись:', e);
                }
            }
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
            sphere.classList.remove('listening');
            userInput.placeholder = 'Напиши сообщение...';
        }

        micBtn.addEventListener('click', toggleVoice);

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onstart = () => sphere.classList.add('speaking');
            utterance.onend = () => sphere.classList.remove('speaking');
            utterance.onerror = () => sphere.classList.remove('speaking');

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
